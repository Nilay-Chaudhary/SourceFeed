services:

  postgres:
    image: postgres:16-alpine
    container_name: social-feed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialfeed}
      POSTGRES_USER: ${POSTGRES_USER:-socialfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialfeed}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
  image: bitnami/kafka:3.7
  container_name: social-feed-kafka
  restart: unless-stopped
  environment:
    KAFKA_ENABLE_KRAFT: "yes"
    KAFKA_CFG_PROCESS_ROLES: broker,controller
    KAFKA_CFG_NODE_ID: 1
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

    KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

    KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

    KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

    KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1

    ALLOW_PLAINTEXT_LISTENER: "yes"

  volumes:
    - kafka_data:/bitnami/kafka

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: social-feed-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-socialfeed}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-socialfeed}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_ENABLED: "true"

      JWT_SECRET: ${JWT_SECRET}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      HF_SPACES_URL: ${HF_SPACES_URL:-}
      HF_API_KEY: ${HF_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - backend_logs:/app/logs

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: social-feed-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: social-feed-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  backend_logs: